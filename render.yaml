# Render Blueprint: creates the backend API for all 14 XAG apps in one go.
# Render -> New -> Blueprint -> pick the planet-of-the-apps repo.
# After the first sync, add SUPABASE_SERVICE_ROLE_KEY ONCE to the "xag-shared"
# environment group (Render -> Environment Groups). All 14 services redeploy with it.
# (Render does not allow secret prompts inside environment groups.)
# API_ADMIN_KEY / API_ADMIN_PIN are generated randomly by Render per service.

envVarGroups:
  - name: xag-shared
    envVars:
      - key: SUPABASE_URL
        value: https://iwpfhalextbzbvcajtxu.supabase.co
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ERROR_ALERT_EMAIL
        value: xaglobally@gmail.com

services:
  - type: web
    name: reputationpilot-med-spas-api
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/xaglobally-lgtm/reputationpilot-med-spas
    branch: main
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - fromGroup: xag-shared
      - key: APP_NAME
        value: reputationpilot-med-spas
      - key: ALLOWED_ORIGINS
        value: https://reputationpilot-med-spas.vercel.app
      - key: API_ADMIN_KEY
        generateValue: true
      - key: API_ADMIN_PIN
        generateValue: true

